syntax = "proto3"; //версия языка

package analytics; //пространство имен

message Empty {} //передаем пустое сообщение если метод не требует параметров

//Описывает ответ для метода GetSummary.
message Summary {
  int32 users = 1;
  int32 lists = 2;
  int32 notes = 3;
  int32 subscriptions = 4;
}
// Один список в топе
message ListStat {
  int32 list_id = 1;
  string title = 2;
  int32 notes_count = 3;
  int32 subscribers_count = 4;
}

// Один пользователь в топе
message UserStat {
  int32 user_id = 1;
  string username = 2;
  string email = 3;
  int32 notes_count = 4;
}

// Один автор в топе
message AuthorStat {
  string author = 1;
  int32 mentions = 2;
}
message LimitRequest {
  int32 limit = 1;
}
//Описывает интерфейс какие методы есть у сервиса
//Из этого блока генерируется и сервер, и клиент.  
//Из него сгенерируются классы AnalyticsServiceStub (клиент) и AnalyticsServiceServicer (сервер).
service AnalyticsService {
  rpc GetSummary (Empty) returns (Summary); //объявление метода
  rpc GetTopLists (LimitRequest) returns (stream ListStat);
  rpc GetTopUsers (LimitRequest) returns (stream UserStat);
  rpc GetTopAuthors (LimitRequest) returns (stream AuthorStat);
}